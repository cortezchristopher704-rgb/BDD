<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de la Librería · Iniciar sesión</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">

    <div class="brand-mark">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 5.5C3 5.5 6 4 9.5 4C11 4 12 4.5 12 4.5V19.5C12 19.5 11 19 9.5 19C6 19 3 20.5 3 20.5V5.5Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M21 5.5C21 5.5 18 4 14.5 4C13 4 12 4.5 12 4.5V19.5C12 19.5 13 19 14.5 19C18 19 21 20.5 21 20.5V5.5Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Panel de la Librería</div>
        <div class="brand-sub">Acceso para empleados</div>
      </div>
    </div>

    <h1>Inicia sesión</h1>
    <p class="lead">Usa el correo y la contraseña que te asignó el administrador.</p>

    <div id="login-error" class="form-error"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Correo</label>
        <input type="email" id="email" name="email" placeholder="tu.nombre@libreria.com" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" id="login-submit" class="btn-pill">Iniciar sesión</button>
    </form>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
