<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de la Librería · Ventas</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="brand-mark">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 5.5C3 5.5 6 4 9.5 4C11 4 12 4.5 12 4.5V19.5C12 19.5 11 19 9.5 19C6 19 3 20.5 3 20.5V5.5Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M21 5.5C21 5.5 18 4 14.5 4C13 4 12 4.5 12 4.5V19.5C12 19.5 13 19 14.5 19C18 19 21 20.5 21 20.5V5.5Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Librería</div>
        <div class="brand-sub">Panel interno</div>
      </div>
    </div>

    <nav>
      <a href="dashboard.html">Inicio</a>
      <a href="clientes.html">Clientes</a>
      <a href="libros.html">Libros</a>
      <a href="autores.html">Autores</a>
      <a href="categorias.html">Categorías</a>
      <a href="ventas.html" class="active">Ventas</a>
      <a href="proveedores.html" class="admin-only">Proveedores</a>
      <a href="compras.html" class="admin-only">Compras</a>
      <a href="empleados.html" class="admin-only">Empleados</a>
    </nav>

    <div class="sidebar-footer">
      <div class="quien-soy">
        <strong id="nombre-empleado">—</strong>
        <span id="rol-empleado">—</span>
      </div>
      <button id="logout-btn" class="btn-logout">Cerrar sesión</button>
    </div>
  </aside>

  <main class="main-content">

    <div class="page-header">
      <div>
        <h1>Ventas</h1>
        <p id="subtitulo"></p>
      </div>
      <button id="btn-nuevo" class="btn-pill btn-auto">+ Nueva venta</button>
    </div>

    <div class="toolbar">
      <input type="search" id="buscador" placeholder="Buscar por folio, cliente, empleado o libro...">
      <select id="filtro-estatus">
        <option value="todos">Todas</option>
        <option value="activo" selected>Activas</option>
        <option value="inactivo">Canceladas</option>
      </select>
    </div>

    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Folio</th>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Atendió</th>
            <th>Piezas</th>
            <th>Total</th>
            <th>Estatus</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tabla-body">
          <tr><td colspan="8" class="empty-state">Cargando ventas...</td></tr>
        </tbody>
      </table>
    </div>

  </main>
</div>

<!-- Ventana: nueva venta -->
<div id="modal-venta" class="modal-overlay">
  <div class="modal modal-wide">
    <h2>Nueva venta</h2>

    <div id="form-error" class="form-error"></div>

    <form id="form-venta">
      <div class="field">
        <label for="cliente">Cliente</label>
        <select id="cliente"></select>
      </div>

      <div class="field">
        <label>Libros *</label>
        <div id="lineas"></div>
        <button type="button" id="btn-agregar-linea" class="link-btn">+ Agregar otro libro</button>
      </div>

      <div class="total-venta"><span>Total</span><span id="total-venta">$0.00</span></div>

      <div class="modal-actions">
        <button type="button" id="btn-cancelar" class="btn-secondary">Cancelar</button>
        <button type="submit" id="btn-guardar" class="btn-pill">Registrar venta</button>
      </div>
    </form>
  </div>
</div>

<!-- Ventana: detalle de una venta -->
<div id="modal-detalle" class="modal-overlay">
  <div class="modal modal-wide" id="detalle-contenido"></div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/session.js"></script>
<script src="js/ventas.js"></script>
</body>
</html>
